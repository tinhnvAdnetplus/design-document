[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-multi-agent-runtime"
version = "0.1.0"
description = "Production infrastructure for the AI Multi-Agent Runtime"
requires-python = ">=3.11"

[project.scripts]
ai-runtime = "ai_runtime.cli:main"

[project.optional-dependencies]
validation = ["jsonschema>=4.19,<5"]

[tool.setuptools.packages.find]
where = ["src"]
